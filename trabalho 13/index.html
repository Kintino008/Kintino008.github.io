<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Sorteio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Jogo de Apostas: Sorteio de 1 a 10</h1>

        <div class="saldo-section">
            <label for="saldoInput">Carregar Saldo:</label>
            <input type="number" id="saldoInput" placeholder="Ex: 100">
            <button id="carregarSaldo">Carregar <img src="https://i.imgur.com/ZgO3F0k.png" alt="nota" class="money-icon"></button>
        </div>

        <div class="aposta-section">
            <label for="apostaValor">Valor da Aposta:</label>
            <input type="number" id="apostaValor" placeholder="Ex: 10">
            
            <label for="apostaNumero">Número (1-10):</label>
            <input type="number" id="apostaNumero" placeholder="Ex: 5">

            <label>
                <input type="checkbox" id="usarDica"> Usar Dicas (-10% no ganho)
            </label>

            <button id="apostar">Apostar <img src="https://i.imgur.com/ZgO3F0k.png" alt="nota" class="money-icon"></button>
        </div>

        <div class="status">
            <p id="mensagem"></p>
            <p>Saldo: <span id="saldoDisplay">0</span>€</p>
            <p>Tentativas: <span id="tentativas">0</span></p>
        </div>

        <h2>Histórico de Apostas</h2>
        <table>
            <thead>
                <tr>
                    <th>Numero Apostado</th>
                    <th>Resultado</th>
                    <th>Dica</th>
                    <th>Saldo</th>
                </tr>
            </thead>
            <tbody id="history">
                <!-- Linhas geradas dinamicamente -->
            </tbody>
        </table>

        <div id="cheque" class="cheque">
            <!-- Cheque final aparecerá aqui -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
