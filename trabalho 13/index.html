<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo do Número Secreto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">

        <h1>🎲 Jogo do Número Secreto (1 a 10)</h1>

        <h3>Saldo: <span id="saldoDisplay">0.00</span>€</h3>
        <input type="number" id="saldoInput" placeholder="Carregar saldo" min="1">
        <button id="carregarSaldo">Carregar</button>

        <hr>

        <h3>Aposta</h3>
        <input type="number" id="apostaValor" placeholder="Valor da aposta" min="1">

        <h3>Número</h3>
        <input type="number" id="apostaNumero" placeholder="Adivinha (1 a 10)" min="1" max="10">

        <div class="dicas">
            <label>
                <input type="checkbox" id="usarDica">
                Jogar com dicas (-10% no prémio)
            </label>
        </div>

        <button id="apostar">Apostar</button>

        <p id="mensagem"></p>
        <p>Tentativas: <span id="tentativas">0</span></p>

        <!-- Imagem de vitória -->
        <img id="imgVitoria" src="1000037384.jpg" style="display:none; width:250px; margin-top:20px;">

        <!-- Cheque -->
        <div id="cheque" class="cheque"></div>

        <hr>

        <h2>Histórico</h2>
        <table>
            <thead>
                <tr>
                    <th>Aposta</th>
                    <th>Resultado</th>
                    <th>Dica</th>
                    <th>Saldo</th>
                </tr>
            </thead>
            <tbody id="history"></tbody>
        </table>

    </div>

    <script src="script.js"></script>
</body>
</html>
